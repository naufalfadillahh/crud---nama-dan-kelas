<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nama dan Kota Asal | Aplikasi CRUD</title>
  <meta name="description" content="Aplikasi CRUD sederhana: tambah, ubah, hapus, cari, dan urutkan data nama dan kota asal. HTML + JavaScript dengan back-end PHP + MySQL.">
  <style>
    :root { --ink: #1e293b; --muted: #64748b; --line: #e2e8f0; --bg: #eef2f7; --brand: #2563eb; --brand-dark: #1d4ed8; --danger: #dc2626; --ok: #16a34a; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; }
    .container { max-width: 760px; margin: 40px auto; padding: 0 16px; }
    header { margin-bottom: 20px; }
    h1 { margin: 0; font-size: clamp(26px, 4vw, 34px); letter-spacing: -.02em; }
    header p { margin: 4px 0 0; color: var(--muted); }
    .card { background: #fff; border-radius: 16px; padding: 22px; box-shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 14px 32px -20px rgba(15, 23, 42, .35); margin-bottom: 18px; }
    .card h2 { margin: 0 0 14px; font-size: 18px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .badge { font-size: 12px; font-weight: 700; color: var(--brand); background: #eff6ff; border-radius: 999px; padding: 3px 10px; }
    form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; align-items: end; }
    label { display: block; font-weight: 600; font-size: 13.5px; margin-bottom: 6px; }
    input[type="text"], input[type="search"] { width: 100%; padding: 11px 13px; border: 1.5px solid var(--line); border-radius: 10px; font: inherit; background: #fff; }
    input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px rgba(37, 99, 235, .12); }
    button { font: inherit; font-weight: 600; cursor: pointer; border-radius: 10px; border: 1.5px solid var(--line); background: #fff; padding: 10px 16px; transition: background .15s, border-color .15s, transform .15s; }
    button:active { transform: translateY(1px); }
    .primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    .primary:hover { background: var(--brand-dark); }
    .actions-form { display: flex; gap: 8px; }
    .editing-note { grid-column: 1 / -1; margin: 0; font-size: 13.5px; color: #92400e; background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px; padding: 8px 12px; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .toolbar input { flex: 1 1 220px; }
    .sort-btn { font-size: 13.5px; padding: 8px 12px; }
    .sort-btn.on { background: var(--ink); border-color: var(--ink); color: #fff; }
    table { width: 100%; border-collapse: collapse; font-size: 15px; }
    th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); }
    td { padding: 12px; border-bottom: 1px solid var(--line); }
    tr.editing td { background: #fffbeb; }
    .row-actions { text-align: right; white-space: nowrap; }
    .row-actions button { padding: 6px 12px; font-size: 13.5px; }
    .edit-btn { color: var(--brand); }
    .delete-btn { color: var(--danger); margin-left: 6px; }
    .delete-btn:hover { background: #fef2f2; border-color: #fecaca; }
    .empty { text-align: center; color: var(--muted); padding: 26px 0; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; box-shadow: 0 14px 30px -12px rgba(0, 0, 0, .45); }
    .toast.err { background: var(--danger); }
    footer { text-align: center; color: var(--muted); font-size: 13px; }
    @media (max-width: 600px) {
      .container { margin: 24px auto; }
      form { grid-template-columns: 1fr; }
      .actions-form button { flex: 1; }
      th:first-child, td:first-child { padding-left: 4px; }
      .row-actions button { padding: 6px 9px; }
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>Nama dan Kota Asal</h1>
    <p>Tambah, ubah, hapus, cari, dan urutkan data pengguna.</p>
  </header>

  <section class="card" aria-labelledby="formTitle">
    <h2 id="formTitle">Tambah data</h2>
    <form id="dataForm" autocomplete="off">
      <input type="hidden" id="userId">
      <div><label for="nama">Nama</label><input type="text" id="nama" placeholder="Contoh: Budi" maxlength="40" required></div>
      <div><label for="kota">Kota asal</label><input type="text" id="kota" placeholder="Contoh: Bogor" maxlength="40" required></div>
      <div class="actions-form">
        <button type="button" id="cancelEdit" hidden>Batal</button>
        <button type="submit" class="primary" id="submitBtn">Simpan</button>
      </div>
      <p class="editing-note" id="editingNote" hidden></p>
    </form>
  </section>

  <section class="card" aria-labelledby="listTitle">
    <h2 id="listTitle">Daftar pengguna <span class="badge" id="count">0</span></h2>
    <div class="toolbar">
      <input type="search" id="search" placeholder="Cari nama atau kota…" aria-label="Cari">
      <button class="sort-btn" data-key="nama">Urutkan nama</button>
      <button class="sort-btn" data-key="kota">Urutkan kota</button>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>Nama</th><th>Kota</th><th class="row-actions">Aksi</th></tr></thead>
        <tbody id="dataList"><tr><td colspan="3" class="empty">Memuat data…</td></tr></tbody>
      </table>
    </div>
  </section>
  <footer>HTML + JavaScript · PHP + MySQL</footer>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
let usersData = [];
let sort = { key: null, dir: 1 };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let toastTimer;
function toast(msg, isErr) {
  const t = $('toast');
  t.textContent = msg; t.className = 'toast' + (isErr ? ' err' : ''); t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 2200);
}

async function request(url, method, body) {
  const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  let data = null;
  try { data = await res.json(); } catch { /* respons kosong */ }
  if (!res.ok) throw new Error((data && data.error) || 'Permintaan gagal');
  return data;
}

async function fetchData() {
  try {
    usersData = await request('get_data.php', 'GET');
    displayData();
  } catch (err) {
    $('dataList').innerHTML = '<tr><td colspan="3" class="empty">Data gagal dimuat.</td></tr>';
  }
}

function displayData() {
  const q = $('search').value.trim().toLowerCase();
  let rows = usersData.filter((u) => !q || (u.nama + ' ' + u.kota).toLowerCase().includes(q));
  if (sort.key) rows = [...rows].sort((a, b) => a[sort.key].localeCompare(b[sort.key], 'id') * sort.dir);
  $('count').textContent = usersData.length;
  const editingId = $('userId').value;
  $('dataList').innerHTML = rows.length
    ? rows.map((u) => `
      <tr class="${String(u.id) === editingId ? 'editing' : ''}">
        <td>${esc(u.nama)}</td>
        <td>${esc(u.kota)}</td>
        <td class="row-actions">
          <button class="edit-btn" data-edit="${esc(u.id)}">Edit</button><button class="delete-btn" data-delete="${esc(u.id)}">Hapus</button>
        </td>
      </tr>`).join('')
    : `<tr><td colspan="3" class="empty">${q ? 'Tidak ada data yang cocok.' : 'Belum ada data. Tambahkan lewat formulir di atas.'}</td></tr>`;
}

function setEditing(user) {
  $('userId').value = user ? user.id : '';
  $('nama').value = user ? user.nama : '';
  $('kota').value = user ? user.kota : '';
  $('formTitle').textContent = user ? 'Ubah data' : 'Tambah data';
  $('submitBtn').textContent = user ? 'Simpan perubahan' : 'Simpan';
  $('cancelEdit').hidden = !user;
  $('editingNote').hidden = !user;
  if (user) { $('editingNote').textContent = `Mengubah data milik ${user.nama}.`; $('nama').focus(); }
  displayData();
}

$('dataForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  const id = $('userId').value;
  const nama = $('nama').value.trim();
  const kota = $('kota').value.trim();
  if (!nama || !kota) { toast('Nama dan kota wajib diisi', true); return; }
  try {
    await request(id ? 'update_data.php' : 'save_data.php', id ? 'PUT' : 'POST', { id, nama, kota });
    toast(id ? 'Data diperbarui' : 'Data ditambahkan');
    setEditing(null);
    fetchData();
  } catch (err) { toast(err.message, true); }
});

$('cancelEdit').addEventListener('click', () => setEditing(null));
$('search').addEventListener('input', displayData);

$('dataList').addEventListener('click', async (e) => {
  const editId = e.target.dataset.edit;
  const delId = e.target.dataset.delete;
  if (editId) setEditing(usersData.find((u) => String(u.id) === editId));
  if (delId) {
    const u = usersData.find((x) => String(x.id) === delId);
    if (!confirm(`Hapus data ${u ? u.nama : ''}?`)) return;
    try {
      await request('delete_data.php', 'DELETE', { id: delId });
      if ($('userId').value === delId) setEditing(null);
      toast('Data dihapus');
      fetchData();
    } catch (err) { toast(err.message, true); }
  }
});

document.querySelectorAll('.sort-btn').forEach((b) => b.addEventListener('click', () => {
  sort = sort.key === b.dataset.key ? { key: b.dataset.key, dir: -sort.dir } : { key: b.dataset.key, dir: 1 };
  document.querySelectorAll('.sort-btn').forEach((x) => {
    const on = x.dataset.key === sort.key;
    x.classList.toggle('on', on);
    x.textContent = `Urutkan ${x.dataset.key}` + (on ? (sort.dir === 1 ? ' ↑' : ' ↓') : '');
  });
  displayData();
}));

fetchData();
</script>
</body>
</html>
